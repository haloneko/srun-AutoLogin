[package]
name = "srun-core"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1"
serde_json = "1"
# serde 仅用于派生 Serialize，步骤 7 起 LoginInfo 等结构需要
serde = { version = "1", features = ["derive"] }
# 时间戳，对应 Python datetime.now().strftime("%H:%M:%S")
chrono = "0.4"
# hex 编解码：步骤 5 测试用例解码黄金向量；步骤 7 起 password/chkstr 输出 hex
hex = "0.4"
# 自定义字母表 Base64，对应 Python srun_lib.base64_encode
base64 = "0.22"
